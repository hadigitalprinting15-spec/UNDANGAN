<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk & Admin Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --gold: #d97706;
            --gold-hover: #b45309;
            --border-color: #334155;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Modal Layout */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: var(--card-bg);
            border-radius: 8px;
            max-width: 800px;
            width: 90%;
            padding: 20px;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .modal-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .modal-info small {
            color: #94a3b8;
            text-transform: uppercase;
        }

        .modal-info h2 {
            margin: 0;
            color: #fff;
        }

        .modal-info p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        .detail {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .detail div {
            display: flex;
            justify-content: space-between;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
            border: none;
        }

        .btn-gold {
            background-color: var(--gold);
            color: #fff;
        }

        .btn-gold:hover {
            background-color: var(--gold-hover);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Katalog Produk</h1>
        <p>Silakan kelola atau lihat detail produk di bawah ini.</p>
        
        <!-- Modal Detail Produk -->
        <div id="productModal" class="modal">
            <div class="modal-content">
                <div class="slide-dots" id="mDots"></div>
                <div class="modal-info">
                    <small id="mGroup"></small>
                    <h2 id="mTitle"></h2>
                    <p id="mDesc"></p>
                    <div class="detail">
                        <div><strong>Kode</strong><span id="mCode"></span></div>
                        <div><strong>Ukuran</strong><span id="mSize"></span></div>
                        <div><strong>Bahan</strong><span id="mPaper"></span></div>
                        <div><strong>Harga Estimasi</strong><span id="mPrice"></span></div>
                        <div id="mBulkRow" style="display:none;">
                            <strong>Minimal Order</strong><span id="mBulkPrice" style="color:var(--gold)"></span>
                        </div>
                        <a id="mWa" class="btn btn-gold" target="_blank" style="width:100%; margin-top: 15px;">💬 Pesan / Tanya Detail Produk</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- === KODE JAVASCRIPT === -->
    <script>
        // === KONFIGURASI CLOUDINARY ===
        const CLOUDINARY_CLOUD_NAME = 'o1w0bczv';
        const CLOUDINARY_UPLOAD_PRESET = 'oizwqsrr';

        // Fungsi Helper untuk Upload Media ke Cloudinary
        async function uploadToCloudinary(file) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);

            const resourceType = file.type.startsWith('video/') ? 'video' : 'image';
            const url = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) {
                    throw new Error('Gagal mengunggah file ke Cloudinary');
                }

                const data = await response.json();
                return data.secure_url;
            } catch (error) {
                console.error('Error Cloudinary Upload:', error);
                alert('Gagal mengunggah media. Pastikan koneksi internet stabil.');
                return null;
            }
        }

        // Contoh Penggunaan Fungsi Modal
        function showProductDetail(product) {
            document.getElementById('mGroup').innerText = product.group || '';
            document.getElementById('mTitle').innerText = product.title || '';
            document.getElementById('mDesc').innerText = product.description || '';
            document.getElementById('mCode').innerText = product.code || '-';
            document.getElementById('mSize').innerText = product.size || '-';
            document.getElementById('mPaper').innerText = product.paper || '-';
            document.getElementById('mPrice').innerText = product.price || '-';

            if (product.bulkPrice) {
                document.getElementById('mBulkRow').style.display = 'flex';
                document.getElementById('mBulkPrice').innerText = product.bulkPrice;
            } else {
                document.getElementById('mBulkRow').style.display = 'none';
            }

            const waMessage = encodeURIComponent(`Halo, saya tertarik dengan produk ${product.title} (Kode: ${product.code})`);
            document.getElementById('mWa').href = `https://wa.me/6281234567890?text=${waMessage}`;

            document.getElementById('productModal').style.display = 'flex';
        }

        // Tutup Modal jika diklik luar kotak modal
        window.onclick = function(event) {
            const modal = document.getElementById('productModal');
            if (event.target === modal) {
                modal.style.display = "none";
            }
        };
    </script>
</body>
</html>
